# Prueba el programa y genera el instalador de Windows en cada push a main.
# - El .exe queda como "artifact" descargable en la pestaña Actions.
# - Además se publica en Releases con el tag vX.Y.Z, tomando la versión de package.json.
#   Para sacar una versión nueva, subí el número de "version" en package.json.
name: Instalador de Windows y app del celular

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas automáticas
        run: npm test

      - name: Pruebas de la base de datos (SQLite)
        run: npm run test:almacen

      - name: Leer versión
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Armar las herramientas (Cargador de productos y Lector de facturas)
        run: npm run herramientas

      - name: Generar instalador
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Stock-Ferreteria-Windows
          path: |
            dist/*.exe
          retention-days: 30

      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Stock Ferretería ${{ steps.ver.outputs.v }}
          files: |
            dist/Stock-Ferreteria-Instalador-*.exe
            dist/Stock-Ferreteria-Portable-*.exe
            herramientas/Cargador-de-productos.html
            herramientas/Lector-de-facturas.html
          body: |
            **Cómo instalar**
            - `Stock-Ferreteria-Instalador-…exe`: instala el programa y crea un acceso directo en el escritorio.
            - `Stock-Ferreteria-Portable-…exe`: se ejecuta sin instalar (sirve para llevar en un pendrive).
            - `Lector-de-facturas.html`: programa aparte que lee las e-facturas en PDF de los proveedores y arma el Excel para importar (productos, costos y, si se elige, la mercadería que llegó). También está en el menú Herramientas del programa.
            - `Cargador-de-productos.html`: programa aparte para cargar productos con el lector de códigos recorriendo el local. Se abre con doble clic (Chrome o Edge), no necesita internet y arma el Excel para importar en Productos → Importar desde Excel.

            Windows puede mostrar "Windows protegió su PC" porque el programa no está firmado: tocá **Más información → Ejecutar de todas formas**.

            Al instalar una versión nueva encima de la anterior, los datos se conservan.

  # App del celular (Etiquetador, Android): se arma después del instalador y se sube a la misma versión
  android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Leer versiones
        id: ver
        run: |
          echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "app=$(node -p "require('./celular/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Armar la página de la app
        run: node herramientas/armar.js

      - name: Dependencias de la app
        working-directory: celular
        run: |
          npm ci
          npx cap sync android

      - name: Llave de firma (si está cargada como secreto)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/grupomuros.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/grupomuros.jks" >> "$GITHUB_ENV"
          fi

      - name: Armar el APK
        working-directory: celular/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_NAME: ${{ steps.ver.outputs.app }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          SALIDA="../Etiquetador-Grupo-Muros-${{ steps.ver.outputs.app }}.apk"
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "$SALIDA"
          else
            echo "::warning::Sin llave de firma: APK de prueba (para actualizarlo hay que desinstalar el anterior)"
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "$SALIDA"
          fi

      - name: Revisar el APK
        run: |
          APK=$(ls celular/Etiquetador-Grupo-Muros-*.apk)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdk|uses-permission|application-label"
          unzip -l "$APK" | grep -E "assets/public/index.html|classes"
          for c in $(unzip -Z1 "$APK" | grep -E '^classes[0-9]*\.dex$'); do unzip -p "$APK" "$c" | grep -c -a "ImpresoraBT" || true; done
          unzip -p "$APK" assets/public/index.html | grep -c "EtiquetaTSPL"
      - name: Habilitar KVM (emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar la app en un emulador de Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r $(ls celular/Etiquetador-Grupo-Muros-*.apk)
            npm install --no-save --no-audit --no-fund playwright@1.64.1
            timeout 420 node celular/prueba-emulador.js || (adb shell cat /proc/net/unix | grep -a devtools; adb logcat -d | grep -a -i -E "capacitor|chromium|AndroidRuntime|FATAL" | tail -60; exit 1)

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Etiquetador-Android
          path: celular/Etiquetador-Grupo-Muros-*.apk
          retention-days: 30

      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          files: celular/Etiquetador-Grupo-Muros-*.apk

