# Prueba el programa y genera el instalador de Windows en cada push a main.
# - El .exe queda como "artifact" descargable en la pestaña Actions.
# - Además se publica en Releases con el tag vX.Y.Z, tomando la versión de package.json.
#   Para sacar una versión nueva, subí el número de "version" en package.json.
name: Instalador de Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas automáticas
        run: npm test

      - name: Pruebas de la base de datos (SQLite)
        run: npm run test:almacen

      - name: Leer versión
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Generar instalador
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Stock-Ferreteria-Windows
          path: |
            dist/*.exe
          retention-days: 30

      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Stock Ferretería ${{ steps.ver.outputs.v }}
          files: |
            dist/Stock-Ferreteria-Instalador-*.exe
            dist/Stock-Ferreteria-Portable-*.exe
          body: |
            **Cómo instalar**
            - `Stock-Ferreteria-Instalador-…exe`: instala el programa y crea un acceso directo en el escritorio.
            - `Stock-Ferreteria-Portable-…exe`: se ejecuta sin instalar (sirve para llevar en un pendrive).

            Windows puede mostrar "Windows protegió su PC" porque el programa no está firmado: tocá **Más información → Ejecutar de todas formas**.

            Al instalar una versión nueva encima de la anterior, los datos se conservan.
