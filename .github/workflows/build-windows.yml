# Genera el instalador de Windows.
# - En cada push a main: deja el .exe como "artifact" descargable en la pestaña Actions.
# - Al crear un tag vX.Y.Z: publica una Release con el instalador y la versión portable.
name: Instalador de Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Usar la versión del tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Generar instalador
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Stock-Ferreteria-Windows
          path: |
            dist/*.exe
          retention-days: 30

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Stock Ferretería ${{ github.ref_name }}
          files: |
            dist/Stock-Ferreteria-Instalador-*.exe
            dist/Stock-Ferreteria-Portable-*.exe
          body: |
            **Cómo instalar**
            - `Stock-Ferreteria-Instalador-…exe`: instala el programa y crea un acceso directo en el escritorio.
            - `Stock-Ferreteria-Portable-…exe`: se ejecuta sin instalar (sirve para llevar en un pendrive).

            Windows puede mostrar "Windows protegió su PC" porque el programa no está firmado: tocá **Más información → Ejecutar de todas formas**.
