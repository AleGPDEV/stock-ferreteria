<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Ventanita que se ve al instante mientras se abre la base y carga la pantalla (ver crearAbriendo en main.js) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'">
<title>Abriendo Stock Ferretería…</title>
<style>
  :root { --bg: #eceff1; --fg: #1f2328; --muted: #59626b; --accent: #ac4e0e; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17191c; --fg: #e8eaed; --muted: #9ea6ae; --accent: #f08c45; color-scheme: dark; } }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--bg); color: var(--fg);
    font: 16px/1.4 "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; cursor: default; -webkit-app-region: drag; }
  img { width: 72px; height: 72px; }
  p { margin: 0; font-weight: 600; }
  .barra { width: 160px; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--muted) 25%, transparent); overflow: hidden; }
  .barra::before { content: ""; display: block; width: 40%; height: 100%; border-radius: 2px; background: var(--accent); animation: ir 1.1s ease-in-out infinite; }
  @keyframes ir { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .barra::before { animation: none; width: 100%; opacity: .6; } }
</style>
</head>
<body>
  <img src="../build/icon.png" alt="">
  <p>Abriendo Stock Ferretería…</p>
  <div class="barra" role="progressbar" aria-label="Abriendo"></div>
</body>
</html>
